name: build-images
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly, picks up base-image updates
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            file: Dockerfile.web
            image: obico-web
          - context: ml_api
            file: ml_api/Dockerfile
            image: obico-ml-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/ebarrere/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
